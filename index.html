<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="mamiita">
<title>let’s go mamiita</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#2a1a33;font-family:Georgia,"Times New Roman",serif}
  body{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
       touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;background:#fdf0d5}
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const W = 520;               // largeur logique fixe
  let H = 800;                 // hauteur logique : s'adapte à l'écran (portrait)
  let GROUND = 480;            // ligne des pieds
  let FLOOR_TOP = 462;         // haut du parquet
  let DECOR_DY = 230;          // décalage vertical du décor
  const G = 0.62, JUMP = -12.6;
  const MAXV = 11.5;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);

  function layout() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const newH = Math.round(Math.max(640, Math.min(1150, W * vh / vw)));
    const s = Math.min(vw / W, vh / newH);
    const cssW = Math.floor(W * s), cssH = Math.floor(newH * s);
    cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';
    cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
    ctx.setTransform(cv.width / W, 0, 0, cv.height / newH, 0, 0);
    H = newH;
    const oldG = GROUND;
    GROUND = Math.round(H * 0.6);
    FLOOR_TOP = GROUND - 18;
    DECOR_DY = FLOOR_TOP - 232;
    gy += GROUND - oldG;
  }

  /* ---------- utilitaires ---------- */
  const rr = (x, y, w, h, r, fill, stroke) => {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
  };
  const rect = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };
  const pad = n => String(n).padStart(5, '0');

  /* ---------- son ---------- */
  let audio = null;
  const ensureAudio = () => {
    if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (audio && audio.state === 'suspended') audio.resume();
  };
  const beep = (f1, f2, dur, type = 'square', vol = 0.05) => {
    if (!audio) return;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, audio.currentTime);
    o.frequency.exponentialRampToValueAtTime(f2, audio.currentTime + dur);
    g.gain.setValueAtTime(vol, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + dur);
  };

  /* ---------- meubles ---------- */
  /* ---------- musique de danse indienne (synthétisée, boucle simple) ---------- */
  const music = { on: false, muted: false, timer: null, next: 0, step: 0, master: null, drone: [], noise: null };
  const SA = 261.63;                                   // Sa = do
  const hz = semi => SA * Math.pow(2, semi / 12);
  // gamme majeure, accroche originale façon danse de mariage (appel / réponse)
  const MELODY = [
    7, null, 7, 9, 7, 4, null, 4,
    5, null, 4, 2, 4, null, 0, null,
    7, null, 7, 9, 12, 9, 7, 9,
    7, 4, 5, 4, 2, 0, null, null,
  ];
  function pluck(f, t, dur, vol) {                     // corde pincée façon sitar
    const o = audio.createOscillator(), o2 = audio.createOscillator();
    const fl = audio.createBiquadFilter(), g = audio.createGain(), g2 = audio.createGain();
    o.type = 'sawtooth'; o2.type = 'triangle';
    o.frequency.setValueAtTime(f * 0.97, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.04);
    o2.frequency.value = f * 2.01; g2.gain.value = 0.35;
    fl.type = 'lowpass'; fl.Q.value = 6;
    fl.frequency.setValueAtTime(3200, t); fl.frequency.exponentialRampToValueAtTime(500, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(fl); o2.connect(g2); g2.connect(fl); fl.connect(g); g.connect(music.master);
    o.start(t); o2.start(t); o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
  }
  function thump(t, f0, f1, dur, vol) {                // tabla grave
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(music.master); o.start(t); o.stop(t + dur + 0.02);
  }
  function ping(t, f, dur, vol) {                      // tabla aiguë
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(music.master); o.start(t); o.stop(t + dur + 0.02);
  }
  function tick(t, vol) {                              // petit souffle de percussion
    const src = audio.createBufferSource(), hp = audio.createBiquadFilter(), g = audio.createGain();
    src.buffer = music.noise; hp.type = 'highpass'; hp.frequency.value = 4500;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    src.connect(hp); hp.connect(g); g.connect(music.master); src.start(t); src.stop(t + 0.08);
  }
  function jingle(t, vol) {                            // bracelets (chudiyan) qui tintent
    for (let k = 0; k < 3; k++) {
      const o = audio.createOscillator(), g = audio.createGain(), at = t + k * 0.03;
      o.type = 'sine'; o.frequency.value = 4200 + Math.random() * 2600;
      g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.09);
      o.connect(g); g.connect(music.master); o.start(at); o.stop(at + 0.1);
    }
  }
  function playStep(i, t) {
    const n = MELODY[i % 32];
    if (n !== null) pluck(hz(n), t, 0.38, 0.065);
    const b = i % 8;
    if (b === 0 || b === 4) thump(t, 150, 55, 0.26, 0.22);       // dha
    if (b === 3 || b === 7) thump(t, 130, 65, 0.16, 0.1);        // ge (contretemps)
    if (b === 2 || b === 6) ping(t, 700, 0.09, 0.05);            // na
    if (b % 2 === 1) tick(t, 0.04);
    if (b === 1 || b === 5) jingle(t, 0.012);
  }
  function musicTick() {
    const stepDur = 60 / 126 / 2;
    while (music.next < audio.currentTime + 0.3) {
      playStep(music.step % 32, music.next);
      music.next += stepDur; music.step++;
    }
  }
  function musicStart() {
    if (!audio || music.on) return;
    music.on = true;
    if (!music.noise) {
      music.noise = audio.createBuffer(1, Math.floor(audio.sampleRate * 0.08), audio.sampleRate);
      const d = music.noise.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    music.master = audio.createGain();
    music.master.gain.value = music.muted ? 0 : 1;
    music.master.connect(audio.destination);
    const dg = audio.createGain(), lp = audio.createBiquadFilter();    // bourdon (tampura)
    lp.type = 'lowpass'; lp.frequency.value = 500;
    dg.gain.setValueAtTime(0.0001, audio.currentTime); dg.gain.linearRampToValueAtTime(0.035, audio.currentTime + 0.6);
    dg.connect(lp); lp.connect(music.master);
    music.drone = [SA / 2, SA * 0.75, SA].map(f => {
      const o = audio.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.connect(dg); o.start(); return o;
    });
    music.next = audio.currentTime + 0.1; music.step = 0;
    music.timer = setInterval(musicTick, 100);
  }
  function musicStop() {
    if (!music.on) return;
    music.on = false; clearInterval(music.timer);
    const m = music.master, d = music.drone;
    m.gain.cancelScheduledValues(audio.currentTime);
    m.gain.setTargetAtTime(0, audio.currentTime, 0.08);
    setTimeout(() => {
      d.forEach(o => { try { o.stop(); } catch (e) {} });
      try { m.disconnect(); } catch (e) {}
    }, 500);
  }
  function toggleMusic() {
    music.muted = !music.muted;
    if (music.on && music.master) music.master.gain.setTargetAtTime(music.muted ? 0 : 1, audio.currentTime, 0.05);
  }

  /* ---------- palette moderne ---------- */
  const C = { oak: '#c99a63', oakD: '#a97c48', walnut: '#7a5133', steel: '#23272b', brass: '#c9a24d',
              sage: '#7c9a86', forest: '#3f5a4c', terra: '#c4704f', navy: '#27374d', cream: '#f2ede4',
              stone: '#d9d3c8', mustard: '#d9a441' };

  /* ---------- gourmandises (obstacles) ---------- */
  const S = { choc: '#4a2a1a', chocD: '#2e1710', milk: '#8a5a3a', cream: '#fff4dc', gold: '#d9a441',
              red: '#b3202a', pink: '#f4a6b8', pist: '#a8d08d', lemon: '#f7e08a', lav: '#c3a6e0', rasp: '#c2185b' };

  function macaron(x, y, w, col) {
    rr(x + 1, y, w - 2, 5, 2.5, col);
    rect(x + 3, y + 4.5, w - 6, 2.5, S.cream);
    rr(x + 1, y + 6.5, w - 2, 4.5, 2.5, col);
    rect(x + 4, y + 1, 9, 1.2, 'rgba(255,255,255,.45)');
  }
  function drawMacarons(x, b) {
    const cols = [S.pink, S.pist, S.lemon, S.lav, '#8a5a3a'];
    for (let i = 0; i < 5; i++) macaron(x, b - 11 * (i + 1), 36, cols[i]);
  }
  function drawBar(x, b) {
    rr(x, b - 60, 34, 60, 3, S.choc, S.chocD);
    for (let c = 0; c < 3; c++) for (let r = 0; r < 3; r++) {
      rr(x + 3 + c * 10, b - 57 + r * 12.5, 8.5, 10.5, 2, '#5f3a26');
      rect(x + 4 + c * 10, b - 56 + r * 12.5, 6, 1.4, 'rgba(255,255,255,.2)');
    }
    ctx.fillStyle = '#e6c15a';
    ctx.beginPath(); ctx.moveTo(x, b - 22);
    for (let i = 0; i < 6; i++) { ctx.lineTo(x + 3 + i * 5.6, b - 27); ctx.lineTo(x + 5.8 + i * 5.6, b - 22); }
    ctx.lineTo(x + 34, b - 18); ctx.lineTo(x, b - 18); ctx.closePath(); ctx.fill();
    rr(x, b - 20, 34, 20, [0, 0, 3, 3], S.red);
    rr(x + 6, b - 14, 22, 6, 2, S.cream);
    ctx.fillStyle = S.gold; ctx.beginPath(); ctx.arc(x + 17, b - 11, 2, 0, 7); ctx.fill();
  }
  function drawJar(x, b) {
    rr(x + 2, b - 38, 36, 38, 7, '#5c311a', 'rgba(255,255,255,.35)');
    rect(x + 6, b - 34, 4, 28, 'rgba(255,255,255,.18)');
    rr(x + 5, b - 28, 30, 18, 3, S.cream);
    rect(x + 5, b - 28, 30, 4, S.red);
    ctx.fillStyle = '#7a4a22'; ctx.beginPath(); ctx.ellipse(x + 20, b - 15, 7, 4.5, -0.3, 0, 7); ctx.fill();
    ctx.fillStyle = '#a06a35'; ctx.beginPath(); ctx.ellipse(x + 19, b - 16, 3, 2, -0.3, 0, 7); ctx.fill();
    rr(x, b - 50, 40, 13, 3, '#f2f2f2', '#cfcfcf');
    for (let i = 0; i < 8; i++) rect(x + 3 + i * 4.5, b - 49, 1, 11, 'rgba(0,0,0,.08)');
  }
  function drawFondant(x, b) {
    ctx.fillStyle = '#f7f7f7'; ctx.strokeStyle = '#d6d6d6'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(x + 28, b - 3, 28, 4, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#5b2a14'; ctx.beginPath(); ctx.ellipse(x + 30, b - 3, 18, 3, 0, 0, 7); ctx.fill();
    ctx.fillStyle = S.chocD; ctx.beginPath(); ctx.moveTo(x + 8, b - 5);
    ctx.quadraticCurveTo(x + 6, b - 30, x + 28, b - 31); ctx.quadraticCurveTo(x + 50, b - 30, x + 48, b - 5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#7a3a1a'; ctx.beginPath(); ctx.moveTo(x + 22, b - 18);
    ctx.quadraticCurveTo(x + 28, b - 14, x + 34, b - 18); ctx.lineTo(x + 36, b - 5); ctx.lineTo(x + 20, b - 5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    [[14, -22], [20, -27], [30, -28], [38, -24], [43, -16], [12, -14]].forEach(([dx, dy]) => ctx.fillRect(x + dx, b + dy, 1.6, 1.6));
    ctx.fillStyle = S.rasp; ctx.beginPath(); ctx.arc(x + 30, b - 34, 4, 0, 7); ctx.fill();
    ctx.fillStyle = '#4c9a4c'; ctx.beginPath(); ctx.ellipse(x + 24, b - 34, 4, 2, -0.5, 0, 7); ctx.fill();
  }
  function drawCookies(x, b) {
    const off = [0, 2, -1];
    for (let i = 0; i < 3; i++) {
      const y = b - 12 - i * 11, ox = x + 2 + off[i];
      rr(ox, y, 40, 12, 6, '#c88b4a', '#a56a2c');
      ctx.fillStyle = S.chocD;
      [[8, 4], [17, 7], [26, 4], [33, 7], [13, 9]].forEach(([dx, dy]) => {
        ctx.beginPath(); ctx.ellipse(ox + dx, y + dy, 2.4, 1.8, 0.3, 0, 7); ctx.fill();
      });
    }
  }
  function drawCupcake(x, b) {
    ctx.fillStyle = S.red;
    ctx.beginPath(); ctx.moveTo(x + 3, b - 16); ctx.lineTo(x + 31, b - 16); ctx.lineTo(x + 26, b); ctx.lineTo(x + 8, b); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.2;
    for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(x + 7 + i * 5, b - 16); ctx.lineTo(x + 10 + i * 3.6, b); ctx.stroke(); }
    rr(x + 1, b - 27, 32, 12, 6, S.choc);
    rr(x + 5, b - 35, 24, 11, 5, '#5a3522');
    rr(x + 10, b - 42, 14, 10, 5, S.choc);
    rect(x + 8, b - 24, 4, 1.5, 'rgba(255,255,255,.2)');
    ['#f4a6b8', '#f7e08a', '#a8d08d', '#ffffff'].forEach((c, i) => rect(x + 7 + i * 6, b - 22 - (i % 2) * 8, 3, 1.6, c));
    ctx.fillStyle = S.rasp; ctx.beginPath(); ctx.arc(x + 17, b - 44, 3.5, 0, 7); ctx.fill();
    ctx.strokeStyle = '#3f7a3a'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x + 17, b - 47); ctx.lineTo(x + 20, b - 50); ctx.stroke();
  }
  function drawPralines(x, b) {
    rr(x, b - 16, 64, 16, 3, '#6e1b2b', S.gold);
    const cols = ['#3b1d12', '#8a5a3a', '#f1e6cf', '#5a3522'];
    cols.forEach((c, i) => {
      const cx = x + 10 + i * 14.7;
      ctx.fillStyle = S.gold;
      ctx.beginPath(); ctx.moveTo(cx - 7, b - 22); ctx.lineTo(cx + 7, b - 22); ctx.lineTo(cx + 5, b - 15); ctx.lineTo(cx - 5, b - 15); ctx.closePath(); ctx.fill();
      ctx.fillStyle = c; ctx.beginPath(); ctx.arc(cx, b - 24, 7, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(cx - 2.5, b - 26.5, 2, 0, 7); ctx.fill();
      if (i === 2) rect(cx - 4, b - 27, 8, 1.4, '#5a3522');
    });
    rect(x + 28, b - 16, 8, 16, S.gold);
  }
  function drawMug(x, b) {
    ctx.strokeStyle = '#efe9df'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(x + 31, b - 15, 6.5, -Math.PI / 2, Math.PI / 2); ctx.stroke();
    rr(x + 3, b - 28, 27, 28, 6, '#efe9df', '#cfc8b9');
    rect(x + 3, b - 20, 27, 5, S.red);
    rr(x + 4, b - 31, 25, 6, 3, '#5b2a14');
    ctx.fillStyle = '#fffaf0';
    [[16.5, -36, 13, 5.5], [16.5, -42, 9.5, 4.5], [16.5, -46, 5.5, 3.5]].forEach(([dx, dy, rx, ry]) => {
      ctx.beginPath(); ctx.ellipse(x + dx, b + dy, rx, ry, 0, 0, 7); ctx.fill();
    });
    ctx.strokeStyle = S.chocD; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x + 8, b - 37); ctx.lineTo(x + 14, b - 34); ctx.lineTo(x + 20, b - 38); ctx.lineTo(x + 26, b - 35); ctx.stroke();
    ctx.strokeStyle = '#9a5b2c'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x + 22, b - 38); ctx.lineTo(x + 30, b - 50); ctx.stroke();
  }
  function drawEclair(x, b) {
    rr(x, b - 22, 66, 22, 10, '#e0b36b');
    rr(x + 2, b - 12, 62, 4, 2, '#fff1d0');
    rr(x, b - 26, 66, 14, [10, 10, 4, 4], S.chocD);
    rect(x + 8, b - 24, 30, 2, 'rgba(255,255,255,.25)');
    [[10, 5], [24, 6], [40, 4], [54, 6]].forEach(([dx, h]) => rr(x + dx, b - 13, 5, h, 2, S.chocD));
    ctx.fillStyle = S.gold;
    [[16, -22], [30, -23], [46, -22]].forEach(([dx, dy]) => ctx.fillRect(x + dx, b + dy, 2, 2));
  }
  function drawDonuts(x, b) {
    const glaze = [S.choc, S.pink, '#6b3a1f'];
    for (let i = 0; i < 3; i++) {
      const y = b - 14 * (i + 1) + (i ? 1 : 0), ox = x + [0, 1, -0.5][i];
      rr(ox, y, 46, 14, 7, '#d9a066');
      rr(ox, y, 46, 9, [7, 7, 4, 4], glaze[i]);
      ['#ffffff', '#f7e08a', '#a8d08d', '#f4a6b8'].forEach((c, k) => rect(ox + 7 + k * 9, y + 2 + (k % 2) * 3, 3, 1.5, c));
    }
  }
  function drawLog(x, b) {
    rr(x, b - 28, 80, 28, 12, S.choc, S.chocD);
    ctx.strokeStyle = S.chocD; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      const o = (i % 2) * 6;
      ctx.beginPath(); ctx.moveTo(x + 8 + i * 12, b - 20 + o); ctx.quadraticCurveTo(x + 14 + i * 12, b - 24 + o, x + 20 + i * 12, b - 20 + o); ctx.stroke();
    }
    ctx.fillStyle = '#e0b36b'; ctx.beginPath(); ctx.ellipse(x + 68, b - 14, 10, 13, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = S.chocD; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x + 68, b - 14, 3, 0, Math.PI * 1.6); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + 68, b - 14, 7, Math.PI, Math.PI * 2.5); ctx.stroke();
    [16, 30].forEach(dx => {
      rect(x + dx - 1.5, b - 34, 3, 6, S.cream);
      ctx.fillStyle = S.cream; ctx.beginPath(); ctx.arc(x + dx, b - 34, 5, Math.PI, 0); ctx.fill();
    });
    ctx.fillStyle = '#3f7a3a';
    ctx.beginPath(); ctx.ellipse(x + 46, b - 31, 6, 3, -0.5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + 53, b - 31, 6, 3, 0.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#c0182a'; ctx.beginPath(); ctx.arc(x + 49.5, b - 32, 2.2, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    [[6, -24], [22, -26], [38, -25], [58, -24]].forEach(([dx, dy]) => ctx.fillRect(x + dx, b + dy, 1.8, 1.8));
  }
  function drawEgg(x, b) {
    ctx.save();
    ctx.beginPath(); ctx.ellipse(x + 17, b - 22, 15, 21, 0, 0, 7); ctx.clip();
    rect(x, b - 44, 34, 44, '#d9a441');
    rect(x, b - 28, 34, 7, S.red);
    ctx.fillStyle = '#fff4dc';
    [[8, -36], [22, -38], [14, -12], [26, -10], [6, -20], [28, -24]].forEach(([dx, dy]) => {
      ctx.beginPath(); ctx.arc(x + dx, b + dy, 1.8, 0, 7); ctx.fill();
    });
    ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.beginPath(); ctx.ellipse(x + 10, b - 32, 3, 8, 0.4, 0, 7); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = '#a87b1f'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(x + 17, b - 22, 15, 21, 0, 0, 7); ctx.stroke();
  }
  function drawSundae(x, b) {
    rr(x + 9, b - 3, 20, 3, 1.5, '#d8e6ea');
    rect(x + 17, b - 14, 4, 12, '#d8e6ea');
    ctx.fillStyle = 'rgba(216,230,234,.85)'; ctx.strokeStyle = '#9fb6bd'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x + 3, b - 32); ctx.lineTo(x + 35, b - 32);
    ctx.quadraticCurveTo(x + 33, b - 14, x + 19, b - 14); ctx.quadraticCurveTo(x + 5, b - 14, x + 3, b - 32);
    ctx.fill(); ctx.stroke();
    [[12, -36, 8.5, '#4a2a1a'], [26, -36, 8.5, '#fff1cf'], [19, -44, 8, '#6b3a1f']].forEach(([dx, dy, r, c]) => {

  const KIDS_IN = 1930;      // les enfants réapparaissent au loin
  const CATCH_START = 2000;  // elle commence à les rattraper
  const CATCH_END = 3000;    // elle les attrape : victoire
  const NO_SPAWN = 2900;     // plus de meubles pour la dernière ligne droite
  const CH_X0 = [400, 440, 480], CH_X1 = [100, 128, 156];
  function chaseKids() {
    if (score < KIDS_IN) return null;
    const e = Math.min(1, (score - KIDS_IN) / (CATCH_START - KIDS_IN));
    const c = Math.min(1, Math.max(0, (score - CATCH_START) / (CATCH_END - CATCH_START)));
    const ee = 1 - Math.pow(1 - e, 2);
    return KID_STYLES.map((st, i) => {
      const xin = W + 50 + i * 30;
      const x = e < 1 ? xin + (CH_X0[i] - xin) * ee : CH_X0[i] + (CH_X1[i] - CH_X0[i]) * c;
      return { x, st, ph: i * 1.7, lane: -12 * (1 - c), sc: 0.88 + 0.12 * c };
    });
  }

    // trois enfants devant elle : ils détalent au départ, puis ne reviennent plus
    kids = [
      { x: 165, dy: -5, st: KID_STYLES[0], ph: 0,   v: 6.2 },
      { x: 208, dy:  3, st: KID_STYLES[1], ph: 1.7, v: 5.4 },
      { x: 250, dy: -1, st: KID_STYLES[2], ph: 3.1, v: 4.6 },
    ];
  }
  reset();

  function spawn() {
    let t;
    do { t = OB[Math.floor(Math.random() * OB.length)]; } while (t === lastType);
    lastType = t;
    const list = [t];
    // petits groupes serrés (seulement des meubles étroits, pour rester sautable)
    if (score > 250 && Math.random() < 0.3) {
      const mates = OB.filter(o => t.w + 38 + o.w <= 120);
      if (mates.length) list.push(mates[Math.floor(Math.random() * mates.length)]);
    }
    let x = W + 20, total = 0;
    for (const d of list) { obs.push({ ...d, x }); x += d.w + 38; total += d.w + 38; }
    // espacements très variés : serré, normal, large, grand vide
    const r = Math.random();
    const mult = r < 0.22 ? 0.85 : r < 0.6 ? 1.2 : r < 0.88 ? 1.8 : 2.8;
    nextIn = total + (170 + speed * 22) * mult + Math.random() * 120;
  }

  function jump() {
    if (gy >= GROUND) { vy = JUMP; beep(420, 820, 0.14); }
  }
  function action() {
    ensureAudio();
    if (state === 'ready') { state = 'run'; musicStart(); jump(); }
    else if (state === 'over' || state === 'won') {
      if (performance.now() - overAt > 350) { reset(); state = 'run'; musicStart(); }
    } else jump();
  }

  window.addEventListener('keydown', e => {
    if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
      e.preventDefault();
      if (!e.repeat) action();
    } else if (e.code === 'KeyM' && !e.repeat) toggleMusic();
  });
  document.addEventListener('pointerdown', e => {
    e.preventDefault();
    const r = cv.getBoundingClientRect();
    const lx = (e.clientX - r.left) * W / r.width, ly = (e.clientY - r.top) * H / r.height;
    if (Math.hypot(lx - (W - 30), ly - 34) < 26) { toggleMusic(); return; }   // bouton musique
    action();
  });
  document.addEventListener('visibilitychange', () => {
    if (!audio) return;
    if (document.hidden) audio.suspend(); else audio.resume();
  });

  /* ---------- boucle ---------- */
  function update(dt) {
    if (state === 'over') return;
    anim += dt * (state === 'run' ? speed / 6 : 0.45);

    if (state === 'won') {
      vy += G * dt; gy += vy * dt;
      if (gy >= GROUND) { gy = GROUND; vy = 0; }
      for (const p of confetti) {
        p.y += p.vy * dt; p.x += p.vx * dt; p.r += p.vr * dt;
        if (p.y > H + 10) { p.y = -10; p.x = Math.random() * W; }
      }
      return;
    }
    if (state !== 'run') return;

    speed = Math.min(MAXV, speed + 0.0016 * dt);
    scroll += speed * dt;
    dist += speed * dt;
    score = Math.floor(dist / 12);

    vy += G * dt; gy += vy * dt;
    if (gy >= GROUND) { gy = GROUND; vy = 0; }

    for (const o of obs) o.x -= speed * dt;
    for (const k of kids) k.x += k.v * dt;
    kids = kids.filter(k => k.x < W + 40);
    while (obs.length && obs[0].x + obs[0].w < -10) obs.shift();
    nextIn -= speed * dt;
    if (nextIn <= 0 && score < NO_SPAWN) spawn();

    // collisions (boîtes un peu indulgentes)
    const gx = 50 + 14, gw = 18, gtop = gy - 60 + 6, gbot = gy - 2;
    for (const o of obs) {
      const ox = o.x + 5, ow = o.w - 10, otop = GROUND - o.h + 5;
      if (gx < ox + ow && gx + gw > ox && gtop < GROUND && gbot > otop) {
        state = 'over'; overAt = performance.now(); hitLabel = o.label;
        if (score > hi) hi = score;
        beep(220, 70, 0.4, 'sawtooth', 0.07);
        musicStop();
        break;
      }
    }

    // 3000 points : elle attrape les trois enfants
    if (state === 'run' && score >= CATCH_END) {
      state = 'won'; overAt = performance.now();
      if (score > hi) hi = score;
      const cols = ['#e91e63', '#ffd23f', '#42a5f5', '#66bb6a', '#ab47bc', '#ff7043'];
      confetti = [];
      for (let i = 0; i < 70; i++) {
        confetti.push({ x: Math.random() * W, y: -Math.random() * H * 0.7, vy: 1.4 + Math.random() * 2,
                        vx: (Math.random() - 0.5) * 1.2, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3,
                        c: cols[i % cols.length], w: 6 + Math.random() * 5, h: 3 + Math.random() * 3 });
      }
      musicStop();
      [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, f * 1.01, 0.2, 'triangle', 0.07), i * 130));
    }
  }

  function draw() {
    // mur en enduit chaud
    const g = ctx.createLinearGradient(0, 0, 0, FLOOR_TOP);
    g.addColorStop(0, '#efe9df'); g.addColorStop(1, '#e3dacb');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, FLOOR_TOP);

    // décor (parallaxe) : rangée du haut, puis rangée du bas
    const off = -((scroll * 0.3) % 1000);
    const off2 = -((scroll * 0.2) % 1000);
    const t2 = (80 + 40 + DECOR_DY) / 2 - 76;
    ctx.save(); ctx.translate(0, t2);
    for (const d of DECOR_TOP) { drawDecor(d, off2 + d.x); drawDecor(d, off2 + d.x + 1000); }
    ctx.restore();
    ctx.save(); ctx.translate(0, DECOR_DY);
    for (const d of DECOR) { drawDecor(d, off + d.x); drawDecor(d, off + d.x + 1000); }
    ctx.restore();

    // plinthe blanche + parquet chêne clair
    rect(0, FLOOR_TOP - 10, W, 10, '#f6f3ee');
    rect(0, FLOOR_TOP - 10, W, 1.5, '#d9d4ca');
    rect(0, FLOOR_TOP, W, H - FLOOR_TOP, '#dcbd94');
    ctx.strokeStyle = '#c8a678'; ctx.lineWidth = 2;
    let fy = FLOOR_TOP;
    for (let r = 0; fy < H; r++) {
      const rh = 22 + r * 3, sp = 90 + r * 14;
      ctx.beginPath(); ctx.moveTo(0, fy); ctx.lineTo(W, fy); ctx.stroke();
      const shift = (scroll * (1 + r * 0.08) + r * 37) % sp;
      for (let x = -shift; x < W; x += sp) {
        ctx.beginPath(); ctx.moveTo(x, fy); ctx.lineTo(x, fy + rh); ctx.stroke();
      }
      fy += rh;
    }

    // tapis crème à liseré graphite
    const rw = 700, rp = 1700, rx = 260 - (scroll % rp);
    for (const ox of [rx, rx + rp]) {
      if (ox > W || ox + rw < 0) continue;
      rr(ox, FLOOR_TOP + 8, rw, 62, 4, '#ece6da');
      ctx.strokeStyle = '#2f3a40'; ctx.lineWidth = 2;
      ctx.strokeRect(ox + 8, FLOOR_TOP + 14, rw - 16, 50);
      ctx.fillStyle = '#c9d3c8';
      for (let px = ox + 30; px < ox + rw - 30; px += 44) {
        ctx.beginPath(); ctx.moveTo(px, FLOOR_TOP + 39); ctx.lineTo(px + 10, FLOOR_TOP + 29);
        ctx.lineTo(px + 20, FLOOR_TOP + 39); ctx.lineTo(px + 10, FLOOR_TOP + 49); ctx.closePath(); ctx.fill();
      }
    }

    // les trois enfants, plus loin dans la pièce, que la cuisinière finit par rattraper
    const ck = chaseKids();
    if (ck) for (const k of ck) {
      const kfy = GROUND + k.lane;
      ctx.fillStyle = 'rgba(0,0,0,.14)';
      ctx.beginPath(); ctx.ellipse(k.x + 10, kfy + 1, 9 * k.sc, 3 * k.sc, 0, 0, 7); ctx.fill();
      ctx.save(); ctx.translate(k.x + 10, kfy); ctx.scale(k.sc, k.sc);
      drawKid(-10, 0, anim * 1.4 + k.ph, k.st);
      ctx.restore();
    }

    // meubles
    for (const o of obs) {
      ctx.fillStyle = 'rgba(0,0,0,.16)';
      ctx.beginPath(); ctx.ellipse(o.x + o.w / 2, GROUND + 1, o.w / 2 + 2, 4, 0, 0, 7); ctx.fill();
      o.draw(o.x, GROUND);
    }

    // les trois chocolats qui fuient
    for (const k of kids) {
      ctx.fillStyle = 'rgba(0,0,0,.16)';
      ctx.beginPath(); ctx.ellipse(k.x + 10, GROUND + k.dy + 1, 9, 3, 0, 0, 7); ctx.fill();
      drawKid(k.x, GROUND + k.dy, anim * 1.4 + k.ph, k.st);
    }

    // ombre + petite cuisinière
    const s = Math.max(0.4, 1 - (GROUND - gy) / 300);
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath(); ctx.ellipse(74, GROUND + 1, 16 * s, 4 * s, 0, 0, 7); ctx.fill();
    drawGirl(50, gy - 60, anim, gy < GROUND);

    // confettis de victoire
    if (state === 'won') {
      for (const p of confetti) {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
    }

    // titre + score + progression vers les enfants
    rr(W / 2 - 140, 14, 280, 78, 16, 'rgba(42,26,51,.84)');
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd23f';
    ctx.font = 'bold 26px Georgia, serif';
    ctx.fillText('let’s go mamiita', W / 2, 47);
    ctx.fillStyle = '#fff3dc';
    ctx.font = 'bold 15px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillText('MEILLEUR ' + pad(hi) + '   ' + pad(score), W / 2, 69);
    const bx = W / 2 - 110, bw = 220, prog = Math.min(1, score / CATCH_END);
    rr(bx, 77, bw, 6, 3, 'rgba(255,255,255,.25)');
    if (prog > 0) rr(bx, 77, Math.max(6, bw * prog), 6, 3, '#ffd23f');
    ctx.fillStyle = '#e91e63'; ctx.beginPath(); ctx.arc(bx + bw * prog, 80, 5, 0, 7); ctx.fill();
    rr(bx + bw + 3, 74, 10, 12, 2, '#c1121f');
    rect(bx + bw + 3, 74, 10, 3, '#d9a441'); rect(bx + bw + 3, 83, 10, 3, '#d9a441');

    // bouton musique
    ctx.fillStyle = 'rgba(42,26,51,.84)'; ctx.beginPath(); ctx.arc(W - 30, 34, 20, 0, 7); ctx.fill();
    ctx.font = '20px sans-serif'; ctx.fillStyle = '#fff';
    ctx.fillText(music.muted ? '🔇' : '🎵', W - 30, 41);

    // indice quand les enfants réapparaissent
    if (state === 'run' && score >= KIDS_IN && score < KIDS_IN + 200) {
      rr(W / 2 - 150, 100, 300, 34, 12, 'rgba(42,26,51,.82)');
      ctx.fillStyle = '#fff3dc';
      ctx.font = 'bold 17px Georgia, serif';
      ctx.fillText('Les Mon Chéri ! Rattrape-les !', W / 2, 123);
    }

    // messages
    const my = Math.round(H * 0.2);
    if (state === 'ready') {
      rr(W / 2 - 170, my, 340, 66, 14, 'rgba(42,26,51,.8)');
      ctx.fillStyle = '#fff3dc';
      ctx.font = 'bold 22px Georgia, serif';
      ctx.fillText('Touche pour jouer', W / 2, my + 30);
      ctx.font = '14px Georgia, serif';
      ctx.fillText('Saute les gourmandises, rattrape les Mon Chéri !', W / 2, my + 52);
      ctx.fillStyle = 'rgba(91,58,41,.9)';
      ctx.font = 'bold 18px Georgia, serif';
      ctx.fillText('👆 Touche l’écran (ou Espace) pour sauter', W / 2, Math.min(H - 40, GROUND + 100));
    } else if (state === 'over') {
      rr(W / 2 - 220, my, 440, 108, 14, 'rgba(42,26,51,.88)');
      ctx.fillStyle = '#fff3dc';
      ctx.font = 'bold 20px Georgia, serif';
      ctx.fillText('Aïe ! Tu as heurté', W / 2, my + 32);
      ctx.fillStyle = '#ffd23f';
      ctx.font = 'bold 28px Georgia, serif';
      ctx.fillText(hitLabel + ' !', W / 2, my + 66);
      ctx.fillStyle = '#fff3dc';
      ctx.font = '15px Georgia, serif';
      ctx.fillText('Touche l’écran pour rejouer', W / 2, my + 92);
    } else if (state === 'won') {
      rr(W / 2 - 220, my, 440, 118, 14, 'rgba(42,26,51,.9)');
      ctx.fillStyle = '#ffd23f';
      ctx.font = 'bold 32px Georgia, serif';
      ctx.fillText('Attrapés ! 🥄', W / 2, my + 42);
      ctx.fillStyle = '#fff3dc';
      ctx.font = '17px Georgia, serif';
      ctx.fillText('Mamiita a rattrapé les trois Mon Chéri !', W / 2, my + 72);
      ctx.font = '15px Georgia, serif';
      ctx.fillText('Touche l’écran pour rejouer', W / 2, my + 100);
    }
  }

  layout();
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 250));

  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 16.667, 3);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
